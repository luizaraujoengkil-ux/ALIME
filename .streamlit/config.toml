# ALIME — Configuração Streamlit
# Tema sincronizado com assets/styles.css

[theme]
base = "dark"
primaryColor = "#D4A93C"
backgroundColor = "#0A1628"
secondaryBackgroundColor = "#11203A"
textColor = "#F4F1E8"
font = "sans serif"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false
